name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported platform runs the same three gates. What a runner
        # cannot prove is injection: it needs a display server and a desktop
        # to send to. X11 is the one platform whose server runs in CI, so
        # the `xvfb` job below is the only place a synthetic event is
        # actually posted; macOS and Windows are verified by hand on real
        # hardware, per AGENTS.md, and claimed no further than that.
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux input dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 libxdo-dev libxkbcommon-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  # The first job in this project that proves injection instead of building
  # it. X11 is the one platform whose display server runs in CI, so this is
  # the only place where construction, connection, injection and read-back
  # are all exercised against a real server on every push.
  #
  # It stays a smoke test. A headless X server is not a desktop: nothing
  # here proves a click reached an application, and per AGENTS.md the claims
  # this project makes still come from manual runs on real hardware.
  xvfb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install Linux input dependencies and a virtual X server
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            libxdo-dev libxkbcommon-dev pkg-config xvfb x11-utils \
            xdotool imagemagick x11-utils bc
      - run: cargo build --workspace --locked
      # The scenarios drive the real pairing, so they need the real sister
      # binary. Fetched prebuilt rather than `cargo install`ed: pixelcoords
      # pulls a capture stack (xcb, pipewire, egl, gbm) that would cost
      # minutes to compile for a job that only needs to run it. The version
      # is the floor `doctor` enforces, so this also proves the pair CI
      # claims to support actually works together.
      - name: Install the pixelcoords the floor requires
        run: |
          curl -fsSL -o /tmp/pixelcoords.tar.gz \
            https://github.com/nolindnaidoo/pixelcoords/releases/download/v0.7.6/pixelcoords-v0.7.6-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/pixelcoords.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp -maxdepth 2 -name pixelcoords -type f | head -1)" /usr/local/bin/pixelcoords
          pixelcoords --version
      # `doctor --probe` reads the cursor, moves it one pixel, asks the
      # server where it ended up and puts it back — so exit 0 means the
      # server honored a synthetic event, not merely that a call returned.
      # XDG_SESSION_TYPE is set because a CI runner declares no session, and
      # this job is specifically the X11 path.
      - name: Prove XTEST injection against a live X server
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            env XDG_SESSION_TYPE=x11 ./target/debug/pixelactions doctor --probe
      # The probe above proves one synthetic event is honored. This proves
      # the product: a session marked from a real capture resolves to a
      # coordinate, the coordinate survives conversion, XTEST accepts it,
      # and the pointer lands on the marked region — read back from the
      # server rather than assumed. Also covers the audit log and the exit
      # codes on a real display.
      - name: Run the acting scenarios against a live X server
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            scripts/x11-scenarios.sh

  # Everything pixelactions does that is *not* input synthesis, on every
  # platform it supports.
  #
  # The `xvfb` job above proves the one thing only Linux CI can prove: that
  # a synthetic event moves a real pointer, read back from the X server. It
  # is X11-only by construction, so until this job existed everything else
  # -- planning against a real session, the refusal a missing --yes earns,
  # the exit codes, the line protocol, the MCP surface, the match-backed
  # verbs -- was proved on one platform out of four.
  #
  # Nothing here synthesises input. That claim stays where it can be
  # verified rather than asserted.
  scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install Linux input dependencies and a virtual X server
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            libxdo-dev libxkbcommon-dev pkg-config xvfb x11-utils
      - run: cargo build --workspace --locked
      # The scenarios drive the real pairing, so they need the real sister
      # binary. Fetched prebuilt rather than `cargo install`ed: pixelcoords
      # pulls a capture stack that would cost minutes to compile for a job
      # that only needs to run it. The version is the floor `doctor`
      # enforces, so this also proves the pair CI claims to support works.
      - name: Install the pixelcoords the floor requires
        shell: bash
        run: |
          base=https://github.com/nolindnaidoo/pixelcoords/releases/download/v0.7.6
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-ARM64)  asset=pixelcoords-v0.7.6-aarch64-apple-darwin.tar.gz ;;
            macOS-X64)    asset=pixelcoords-v0.7.6-x86_64-apple-darwin.tar.gz ;;
            Windows-X64)  asset=pixelcoords-v0.7.6-x86_64-pc-windows-msvc.zip ;;
            Linux-X64)    asset=pixelcoords-v0.7.6-x86_64-unknown-linux-gnu.tar.gz ;;
            *) echo "no pixelcoords build for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL -o "/tmp/$asset" "$base/$asset"
          mkdir -p /tmp/pxc
          case "$asset" in
            *.zip) unzip -q "/tmp/$asset" -d /tmp/pxc ;;
            *)     tar xzf "/tmp/$asset" -C /tmp/pxc ;;
          esac
          binary=$(find /tmp/pxc -maxdepth 2 -name 'pixelcoords*' -type f | head -1)
          dest="$HOME/.pixelcoords-bin"
          mkdir -p "$dest"
          cp "$binary" "$dest/"
          chmod +x "$dest/"* || true
          # Windows needs a native path here. The bash on the runner is
          # MSYS, so $HOME is /c/Users/... -- a form Win32 does not resolve,
          # which means `pixelcoords --version` succeeds in a shell step
          # while a process spawned from a test cannot find it at all.
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest=$(cygpath -w "$dest")
          fi
          echo "$dest" >> "$GITHUB_PATH"
      - name: Prove the pairing resolves
        shell: bash
        run: pixelcoords --version
      # Serially, and on Linux under a virtual X server. Concurrent captures
      # contend for the same display: macOS failed a `shoot` when two ran at
      # once, which is a property of screen capture rather than of this code.
      - name: Run the scenarios against a real display
        if: runner.os != 'Linux'
        run: cargo test --test scenarios -- --test-threads=1
        env:
          PIXELACTIONS_SCENARIOS: "1"
      # A bare virtual display is a flat color, and pixelcoords rightly
      # refuses to match one -- it matches anywhere rather than somewhere.
      # So the display gets something to look at, and the match-backed
      # scenarios run here instead of skipping. Random text, because what
      # matters is that it has detail, not what it says.
      - name: Run the scenarios against a virtual X server
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/scenarios.sh <<'INNER'
          set -e
          lines=""
          for _ in $(seq 1 14); do
            lines="$lines$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
          "
          done
          xmessage -geometry 900x600+40+40 "$lines" &
          sleep 2
          PIXELACTIONS_SCENARIOS=1 XDG_SESSION_TYPE=x11 \
            cargo test --test scenarios -- --test-threads=1
          INNER
          chmod +x /tmp/scenarios.sh
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash /tmp/scenarios.sh

  # The Python client is a separate product on a separate version line's
  # worth of tooling, but it speaks this repo's protocol -- so it is tested
  # here, where a protocol change and its client move together.
  #
  # Path-filtered: a Rust-only change should not pay for a Python run, and
  # a Python-only change should not wait on four platforms of cargo.
  python-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      # No dependencies to install, deliberately: the client is standard
      # library only, and the suite runs against a fake server on the same
      # wire rather than the real binary, so it needs no display either.
      - name: The suite
        working-directory: clients/python
        run: |
          python3 tests/test_session.py
          python3 -c "
          import sys; sys.path.insert(0, 'tests')
          import test_version; test_version.test_client_version_matches_the_workspace()
          print('version matches the workspace')"
      - name: It builds a wheel
        working-directory: clients/python
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel
          ls -l dist/

  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --workspace --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Forbid inline lint suppressions
        run: |
          if grep -rn '#\[allow(' crates --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [workspace.lints].'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for the core crate.
  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov
      - name: Measure core coverage
        run: |
          cargo llvm-cov -p pixelactions-core --no-report
          cargo llvm-cov report -p pixelactions-core --json --output-path coverage.json
      - name: Enforce the per-module floor
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit
      - run: cargo audit
