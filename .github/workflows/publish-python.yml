name: Publish the Python client

# Manual, like the crates. Publishing is irreversible -- PyPI will not let a
# version be replaced, only yanked -- so it is a button someone presses
# after a release, not a side effect of tagging one.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Matches the target, so the trusted-publisher config on each side
    # uses the same name as the place it publishes to.
    environment: ${{ inputs.repository }}
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity
      # instead of a stored API token. Nothing to leak, nothing to rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The version is not an input on purpose: it comes from pyproject.toml,
      # which a test already holds equal to the workspace. Letting a human
      # type it here would be a second place for it to be wrong.
      - name: The version matches the workspace
        working-directory: clients/python
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'tests')
          import test_version; test_version.test_client_version_matches_the_workspace()
          print('version matches the workspace')"

      - name: The suite
        working-directory: clients/python
        run: python3 tests/test_session.py

      - name: Build
        working-directory: clients/python
        run: |
          python3 -m pip install --quiet build
          python3 -m build
          ls -l dist/

      # The *commit* the tag points at, not the annotated tag object's own
      # SHA. This action runs as a container whose image is tagged by
      # commit, so a tag-object SHA resolves to an image that does not
      # exist -- `manifest unknown`, after the build has already run.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: clients/python/dist
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
