name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Every platform where injection actually works — which is now all of
    # them. The binary compiles anywhere (`plan` and `doctor` do), but
    # shipping an archive for a platform that refuses to inject would imply
    # a support this build does not have. Add targets here when a new
    # platform's injector lands, not before.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          # One Linux binary covers both display servers: which one it
          # speaks is decided from the session at runtime, not at build
          # time.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The Linux binary links against libxkbcommon (the compositor sends
      # its keymap over EIS and we look characters up in it), so the
      # headers must be on the runner. Same package CI installs.
      - name: Install Linux input dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 libxkbcommon-dev pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pixelactions
      # Zip on Windows, tar.gz elsewhere — each platform's own convention,
      # so the archive opens with what the reader already has. The binary
      # carries the .exe suffix there, which is why the copy is branched
      # rather than shared.
      - name: Package
        shell: bash
        run: |
          name="pixelactions-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md SKILL.md "$name/"
          cp -r examples "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pixelactions.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/pixelactions" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          files: |
            pixelactions-*.tar.gz
            pixelactions-*.zip
