name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Every platform where injection actually works — which is now all of
    # them. The binary compiles anywhere (`plan` and `doctor` do), but
    # shipping an archive for a platform that refuses to inject would imply
    # a support this build does not have. Add targets here when a new
    # platform's injector lands, not before.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          # One Linux binary covers both display servers: which one it
          # speaks is decided from the session at runtime, not at build
          # time.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The Linux binary links against libxkbcommon (the compositor sends
      # its keymap over EIS and we look characters up in it), so the
      # headers must be on the runner. Same package CI installs.
      - name: Install Linux input dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 libxkbcommon-dev pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pixelactions
      # Zip on Windows, tar.gz elsewhere — each platform's own convention,
      # so the archive opens with what the reader already has. The binary
      # carries the .exe suffix there, which is why the copy is branched
      # rather than shared.
      - name: Package
        shell: bash
        run: |
          name="pixelactions-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md SKILL.md "$name/"
          cp -r examples "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pixelactions.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/pixelactions" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            pixelactions-*.tar.gz
            pixelactions-*.zip
          if-no-files-found: error
          retention-days: 1

  # One job, one caller, one release. Four matrix jobs each calling
  # action-gh-release is a check-then-act race: the action looks the release
  # up by tag and creates it when absent, so two jobs finishing in the same
  # second both see "absent" and both create one. That is not theoretical —
  # the sister project's v0.7.0 tag produced two drafts from a single run,
  # one holding every archive and one holding nothing, and the empty one had
  # to be deleted by hand before the release could be published.
  #
  # `needs: build` also means the draft is complete the moment it appears
  # rather than filling in as jobs land.
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Show what will be attached
        run: ls -l archives
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            archives/pixelactions-*.tar.gz
            archives/pixelactions-*.zip
  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Bump the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap bump"
            exit 0
          fi
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm=$(sha256sum "archives/pixelactions-v${version}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          intel=$(sha256sum "archives/pixelactions-v${version}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/nolindnaidoo/homebrew-tap.git" tap
          python3 scripts/bump-homebrew.py "$version" "$arm" "$intel" tap/Formula/pixelactions.rb

          cd tap
          if git diff --quiet; then
            echo "::notice::formula already current; nothing to push"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "pixelactions ${version}"
          git push
