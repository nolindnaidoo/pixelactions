[workspace]
resolver = "3"
members = ["crates/pixelactions-core", "crates/pixelactions"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
authors = ["Nolin D Naidoo"]
homepage = "https://pixelactions.dev"
repository = "https://github.com/nolindnaidoo/pixelactions"
# keywords / categories are deliberately NOT inherited: the binary and the
# library are found by different searches. Someone typing `cargo install`
# wants a desktop automation tool; someone typing `[dependencies]` wants
# the coordinate-space conversion. Sharing one set meant the library sat
# under `command-line-utilities`, which it is not. Set per-crate — see each
# package manifest. (Same rule as pixelcoords.)

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Every input this tool synthesizes lands at a number. A wrapped coordinate
# is a click in the wrong place — worse than a crash — so overflow keeps
# panicking in release, as it does in debug. (Same rule as pixelcoords.)
overflow-checks = true

# unsafe policy: pixelactions-core carries #![forbid(unsafe_code)]; the
# binary may use unsafe only in platform modules for OS API calls.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate workspace-wide relaxations. Policy: no inline #[allow] anywhere
# (CI enforces); anything relaxed must be listed here, visibly.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Cross-platform report fields are Option because some platforms have
# nothing to report; clippy compiles one target at a time and sees the
# arm that always returns Some. The shape is deliberate.
unnecessary_wraps = "allow"
